name: Deploy
on:
  push:
    branches:
      - develop    # Auto-deploy to dev
      - staging    # Auto-deploy to staging
      - main       # Auto-deploy to production

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    uses: ninkovski/azure-workflow-actions-v1/.github/workflows/deploy-function.yml@main
    with:
      function-app-name: 'func-bartolo-profe-app-process-payment-dev'              
      resource-group: 'bartolo-profe-rg'                        
      package-path: '.'                                  
      environment: 'dev'
      node-version: '18.x'                               
      run-tests: false          
      enable-notifications: false   
      create-release-on-success: false  
    secrets: inherit    
 